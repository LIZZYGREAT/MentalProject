<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 心理压力建模平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #eef4ff 0%, #f8f9fa 55%, #effaf6 100%);
        }
        .login-card {
            width: min(92vw, 420px);
            border: 0;
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(38, 68, 120, 0.13);
        }
    </style>
</head>
<body>
<main class="card login-card">
    <div class="card-body p-4 p-md-5">
        <div class="mb-4">
            <h1 class="h4 mb-2">心理压力建模平台</h1>
            <p class="text-secondary mb-0">使用数据库账号登录调试台</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
            <button id="loginButton" class="btn btn-primary w-100" type="submit">登录</button>
        </form>

        <p class="small text-secondary mt-4 mb-0">
            首个管理员账号请在服务器上通过管理命令创建。
        </p>
    </div>
</main>

<script>
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const errorBox = document.getElementById('loginError');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.classList.add('d-none');
        button.disabled = true;
        button.textContent = '登录中...';
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.message || '登录失败');
            }
            window.location.assign('/');
        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove('d-none');
        } finally {
            button.disabled = false;
            button.textContent = '登录';
        }
    });
</script>
</body>
</html>
