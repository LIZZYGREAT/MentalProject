<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173f38">
    <title>登录 · 心序 MindFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
<main class="auth-shell">
    <section class="auth-story" aria-label="产品介绍">
        <a class="brand brand-light" href="/">
            <span class="brand-mark" aria-hidden="true">
                <span></span><span></span><span></span>
            </span>
            <span>
                <strong>心序</strong>
                <small>MindFlow</small>
            </span>
        </a>

        <div class="story-copy">
            <p class="eyebrow light">把一天，放回自己的节奏里</p>
            <h1>看见压力的趋势，<br>也看见恢复的空间。</h1>
            <p>
                从日程与轻量反馈中提前识别可能的高负荷时段，
                给你克制、温和、可以忽略的支持。
            </p>
        </div>

        <div class="story-preview" aria-hidden="true">
            <div class="preview-orbit orbit-one"></div>
            <div class="preview-orbit orbit-two"></div>
            <div class="preview-card">
                <span class="preview-label">今日节律</span>
                <div class="preview-line">
                    <i style="height: 34%"></i><i style="height: 48%"></i>
                    <i style="height: 42%"></i><i style="height: 68%"></i>
                    <i style="height: 57%"></i><i style="height: 38%"></i>
                    <i style="height: 28%"></i>
                </div>
                <p><span></span> 下午 14:00 前后，给自己留一点缓冲</p>
            </div>
        </div>

        <p class="story-footnote">趋势参考，不用于诊断或替代专业帮助</p>
    </section>

    <section class="auth-panel">
        <div class="auth-panel-inner">
            <div class="mobile-brand">
                <span class="brand-mark" aria-hidden="true">
                    <span></span><span></span><span></span>
                </span>
                <strong>心序 MindFlow</strong>
            </div>

            <div class="auth-heading">
                <p class="eyebrow">欢迎回来</p>
                <h2 id="authTitle">登录你的空间</h2>
                <p id="authSubtitle">继续查看今天的节律与支持建议。</p>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="账号操作">
                <button class="auth-tab active" id="loginTab" type="button">登录</button>
                <button class="auth-tab" id="registerTab" type="button">创建账号</button>
            </div>

            <form id="authForm" novalidate>
                <label class="field-label" for="loginId">邮箱或学号</label>
                <div class="field-shell">
                    <span class="field-icon" aria-hidden="true">ID</span>
                    <input id="loginId" name="login_id" autocomplete="username"
                           maxlength="254" placeholder="name@school.edu.cn 或学号" required autofocus>
                </div>

                <div class="password-label">
                    <label class="field-label" for="password">密码</label>
                    <span id="passwordHint">至少 10 个字符</span>
                </div>
                <div class="field-shell">
                    <span class="field-icon lock-icon" aria-hidden="true"></span>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" minlength="10"
                           placeholder="输入密码" required>
                    <button class="reveal-button" id="revealPassword" type="button"
                            aria-label="显示密码">显示</button>
                </div>

                <div id="authError" class="inline-alert error" role="alert" hidden></div>

                <button id="authButton" class="primary-button auth-submit" type="submit">
                    <span>登录</span><b aria-hidden="true">→</b>
                </button>
            </form>

            <div class="privacy-note">
                <span aria-hidden="true">◇</span>
                <p>
                    你的问卷原答与模型推断分层保存。预测只提供趋势参考，
                    不会给出医学诊断。
                </p>
            </div>
        </div>
    </section>
</main>
<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
