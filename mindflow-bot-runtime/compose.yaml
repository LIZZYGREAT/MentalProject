services:
  claude-state-init:
    image: crpi-8tbzhfoaax5hq44s.cn-shanghai.personal.cr.aliyuncs.com/mind_flow/python
    user: root
    command:
      - sh
      - -c
      - chown -R 10001:10001 /home/mindflow/.claude
    volumes:
      - claude_state:/home/mindflow/.claude
    restart: "no"

  bot:
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      claude-state-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && exec python -m app.main"]
    environment:
      CLAUDE_WORKDIR: /srv/claude-workspace
      CLAUDE_SETTINGS_PATH: /srv/claude-workspace/.claude/settings.json
      HOME: /home/mindflow
    volumes:
      - claude_state:/home/mindflow/.claude
    restart: unless-stopped
    cpus: ${BOT_CPU_LIMIT:-0.75}
    mem_limit: ${BOT_MEMORY_LIMIT:-768m}
    memswap_limit: ${BOT_MEMORY_SWAP_LIMIT:-1280m}
    pids_limit: ${BOT_PID_LIMIT:-128}

  postgres:
    image: crpi-8tbzhfoaax5hq44s.cn-shanghai.personal.cr.aliyuncs.com/mind_flow/postgres
    environment:
      POSTGRES_DB: mindflow
      POSTGRES_USER: mindflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindflow -d mindflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    cpus: ${POSTGRES_CPU_LIMIT:-0.50}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: ${POSTGRES_PID_LIMIT:-100}

volumes:
  postgres_data:
  claude_state:
