services:
  migrate:
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
        INSTALL_DEV_DEPS: "0"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - mindflow-core

  claude-state-init:
    image: crpi-8tbzhfoaax5hq44s.cn-shanghai.personal.cr.aliyuncs.com/mind_flow/python
    user: root
    command:
      - sh
      - -c
      - chown -R 10001:10001 /home/mindflow/.claude
    volumes:
      - claude_state:/home/mindflow/.claude
    restart: "no"

  bot:
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
        INSTALL_DEV_DEPS: "0"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      claude-state-init:
        condition: service_completed_successfully
      research-runtime:
        condition: service_healthy
    command: ["python", "-m", "app.main"]
    environment:
      CLAUDE_WORKDIR: /srv/claude-workspace
      CLAUDE_SETTINGS_PATH: /srv/claude-workspace/.claude/settings.json
      HOME: /home/mindflow
      VISION_MAX_CONCURRENCY: ${VISION_MAX_CONCURRENCY:-1}
      RESEARCH_RUNTIME_URL: ${RESEARCH_RUNTIME_URL:-http://research-runtime:8080}
      RESEARCH_RUNTIME_TOKEN: ${RESEARCH_RUNTIME_TOKEN:-}
    volumes:
      - claude_state:/home/mindflow/.claude
    ports:
      - "${FEISHU_CARD_CALLBACK_PORT:-8000}:${FEISHU_CARD_CALLBACK_PORT:-8000}"
    restart: unless-stopped
    cpus: ${BOT_CPU_LIMIT:-0.75}
    mem_limit: ${BOT_MEMORY_LIMIT:-768m}
    memswap_limit: ${BOT_MEMORY_SWAP_LIMIT:-1280m}
    pids_limit: ${BOT_PID_LIMIT:-128}
    networks:
      - mindflow-core
      - research-rpc

  research-runtime:
    build:
      context: ..
      dockerfile: research-runtime/Dockerfile
    environment:
      RESEARCH_RUNTIME_TOKEN: ${RESEARCH_RUNTIME_TOKEN:-}
      RESEARCH_RUNTIME_REQUIRE_TOKEN: ${RESEARCH_RUNTIME_ENABLED:-false}
      RESEARCH_BROWSER_ENABLED: ${RESEARCH_BROWSER_ENABLED:-true}
      RESEARCH_EXEC_ENABLED: ${RESEARCH_EXEC_ENABLED:-false}
      RESEARCH_BIND_HOST: 0.0.0.0
      RESEARCH_PORT: 8080
    volumes:
      - research_workspace:/workspace
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    cpus: ${RESEARCH_CPU_LIMIT:-0.50}
    mem_limit: ${RESEARCH_MEMORY_LIMIT:-512m}
    memswap_limit: ${RESEARCH_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: ${RESEARCH_PID_LIMIT:-64}
    networks:
      - research-rpc
      - research-public

  acceptance:
    profiles: ["acceptance"]
    image: ${ACCEPTANCE_IMAGE_NAME:-mindflow-acceptance:local}
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
        INSTALL_DEV_DEPS: "1"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${MINDFLOW_TEST_POSTGRES_URL:-}
      MINDFLOW_TEST_POSTGRES_URL: ${MINDFLOW_TEST_POSTGRES_URL:-}
      MINDFLOW_REQUIRE_POSTGRES_TESTS: "1"
      MINDFLOW_TEST_POSTGRES_ALLOWED_HOSTS: ${MINDFLOW_TEST_POSTGRES_ALLOWED_HOSTS:-postgres,localhost,127.0.0.1,::1}
      MINDFLOW_TEST_POSTGRES_CONNECT_TIMEOUT_SECONDS: ${MINDFLOW_TEST_POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    user: root
    volumes:
      - ./tests:/srv/runtime/tests:ro
      - ../claude-runtime:/srv/claude-runtime:ro
      - ../docs:/srv/docs:ro
    command:
      - sh
      - -eu
      - -c
      - |
        test -f /srv/runtime/tests/test_postgres_test_guard.py
        test -f /srv/docs/CURRENT_ARCHITECTURE.md
        test -f /srv/claude-runtime/plugins/mindflow-care/skills/mental-health-care/SKILL.md

        exec python3 -m pytest -q /srv/runtime/tests
    restart: "no"
    cpus: ${ACCEPTANCE_CPU_LIMIT:-1.5}
    mem_limit: ${ACCEPTANCE_MEMORY_LIMIT:-1024m}
    memswap_limit: ${ACCEPTANCE_MEMORY_SWAP_LIMIT:-1536m}
    pids_limit: ${ACCEPTANCE_PID_LIMIT:-256}
    networks:
      - mindflow-core

  admin:
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
        INSTALL_DEV_DEPS: "0"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.admin_web.main"]
    environment:
      ADMIN_PORT: 8081
    volumes:
      - ../claude-runtime:/srv/claude-runtime:ro
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-8081}:8081"
    restart: unless-stopped
    cpus: ${ADMIN_CPU_LIMIT:-0.35}
    mem_limit: ${ADMIN_MEMORY_LIMIT:-384m}
    memswap_limit: ${ADMIN_MEMORY_SWAP_LIMIT:-512m}
    pids_limit: ${ADMIN_PID_LIMIT:-64}
    networks:
      - mindflow-core

  postgres:
    image: crpi-8tbzhfoaax5hq44s.cn-shanghai.personal.cr.aliyuncs.com/mind_flow/postgres
    environment:
      POSTGRES_DB: mindflow
      POSTGRES_USER: mindflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindflow -d mindflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    cpus: ${POSTGRES_CPU_LIMIT:-0.50}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    memswap_limit: ${POSTGRES_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: ${POSTGRES_PID_LIMIT:-100}
    networks:
      - mindflow-core

volumes:
  postgres_data:
  claude_state:
  research_workspace:

networks:
  mindflow-core:
  # Only the bot and research RPC share this internal network. The research
  # runtime still rejects every private/metadata destination at the policy
  # layer, including the Bot service address.
  research-rpc:
    internal: true
  research-public:
