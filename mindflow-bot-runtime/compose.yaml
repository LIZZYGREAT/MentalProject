services:
  bot:
    build:
      context: ..
      dockerfile: mindflow-bot-runtime/Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.main"]
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: mindflow
      POSTGRES_USER: mindflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindflow -d mindflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
