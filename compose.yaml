services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DATABASE_PATH: /app/data/app.sqlite3
      APP_BIND: 0.0.0.0:8000
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
